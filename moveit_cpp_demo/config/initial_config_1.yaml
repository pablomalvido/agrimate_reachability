# ============================================================
# Initial configuration table generation
# ============================================================

# ------------------------------------------------------------
# Joint sampling / IK constraints
# Order:
# 0 = shoulder_pan_joint
# 1 = shoulder_lift_joint
# 2 = elbow_joint
# 3 = wrist_1_joint
# 4 = wrist_2_joint
# 5 = wrist_3_joint
# ------------------------------------------------------------

joint_limits:
  lower:
    - 0.0
    - -1.57
    - 0.0
    - -1.75
    - 0.0
    - 0.0

  upper:
    - 0.0
    - 1.0
    - 2.5
    - 1.75
    - 0.0
    - 0.0


# ------------------------------------------------------------
# Robot placement grid
# ------------------------------------------------------------

placement:
  y:
    min: -1.0
    max: -0.5
    n: 1

  z:
    min: -0.05
    max: 0.35
    n: 10

  roll:
    min: -0.8
    max: 1.05
    n: 10


# ------------------------------------------------------------
# Cartesian workspace where random EE positions are sampled
# ------------------------------------------------------------

cartesian_box:
  x:
    min: -0.15 #0.15 is centered
    max: 0.45

  y:
    min: -1.0
    max: -0.15

  z:
    min: 0.15
    max: 1.5


# ------------------------------------------------------------
# Candidate generation
# ------------------------------------------------------------

# Number of random Cartesian positions/IK attempts
# generated for every robot placement.
n_random_candidates: 200

# Number of best candidates retained at every placement.
k: 10

# Number of representative target points used
# for evaluating motion planning.
number_of_representative_targets: 10


# ------------------------------------------------------------
# Output
# ------------------------------------------------------------

output:
  raw_table_file: "/home/rosdev/ros2_ws/src/moveit_cpp_demo/data/initial_config_optimization/raw_configuration_table_2.txt"
  final_table_file: "/home/rosdev/ros2_ws/src/moveit_cpp_demo/data/initial_config_optimization/final_configuration_table_2.txt"